name: syncbeats_app
description: "SyncBeats - Real-Time Synchronized Music Listening Platform"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Audio Playback & Service
  just_audio: ^0.9.39
  audio_service: ^0.18.13

  # Network & Real-time Websockets
  socket_io_client: ^2.0.3+1
  dio: ^5.4.3+1

  # State & Routing
  provider: ^6.1.2
  go_router: ^14.2.7

  # Local cache & security storage
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2

  # Auth & Utilities
  google_sign_in: ^6.2.1
  file_picker: ^8.0.3
  crypto: ^3.0.3
  uuid: ^4.4.0
  intl: ^0.19.0
  path_provider: ^2.1.3
  permission_handler: ^11.3.1
  
  # Styling & UI animations
  flutter_animate: ^4.5.0
  cached_network_image: ^3.3.1
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
